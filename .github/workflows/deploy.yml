# 全自动部署工作流（napi 多平台 + Changesets）
#
# 触发：推送到 main（命中 packages / 文档 / 示例 / changesets / 工作流 / lockfile 等路径）或手动触发。
# 并行发布（无先后顺序）：
#   - build-native：矩阵在 ubuntu / ubuntu-arm / macos / windows 上编译全部 7 个平台的原生 .node
#   - release    ：归集原生二进制 → changeset version 提升版本 → 构建 JS → changeset publish 发布三个插件到 npm
#   - deploy-site：构建文档站（DOC_BASE=/uno-toolkit/）并部署到 GitHub Pages
#   说明：release 与 deploy-site 互不依赖、同时触发，实现「文档站点 + 三个插件」同步发布。
#
# 启用前的一次性配置：
#   - 仓库 Settings → Secrets → Actions 添加 NPM_TOKEN（@uno-pc 作用域、publish 权限）
#   - 仓库 Settings → Pages → Source 选择 "GitHub Actions"
#
# 说明：
#   - 原生二进制按平台三元组产出（native/<triple>.node），运行时由 src/shared/native.ts 自动选择；
#     这些 .node 已在 .gitignore 忽略，仅作为构建产物随包发布。
#   - 仅有变更集（pnpm changeset）时才会发布新版本；无变更集则仅部署站点、不发布 npm 包。

name: Deploy Docs & Publish Packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/website/**"
      - "examples/**"
      - ".changeset/**"
      - ".github/workflows/deploy.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.15.0"
  CARGO_TERM_COLOR: always

jobs:
  # ── 阶段一（矩阵）：编译全平台原生二进制 ──────────────────────────────
  build-native:
    name: Build native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: "linux-x64-gnu linux-x64-musl"
          - os: ubuntu-24.04-arm
            targets: "linux-arm64-gnu"
          - os: macos-latest
            targets: "darwin-arm64 darwin-x64"
          - os: windows-latest
            targets: "win32-x64-msvc win32-arm64-msvc"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # musl 交叉编译使用 zig（cargo-zigbuild）：musl-gcc 链接 cdylib 会因缺少
      # libgcc_s.so.1 失败，zig 作为 linker + C 编译器是 napi-rs 官方推荐方案
      - name: Setup Zig
        if: contains(matrix.targets, 'musl')
        uses: mlugg/setup-zig@v1

      - name: Install cargo-zigbuild
        if: contains(matrix.targets, 'musl')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native binaries
        shell: bash
        run: |
          set -euo pipefail
          for pkg in jsx-directive reactivue signals-transform style-layer; do
            for t in ${{ matrix.targets }}; do
              echo "::group::build $pkg @ $t"
              TARGET_TRIPLE="$t" node "packages/$pkg/scripts/build-native.mjs"
              echo "::endgroup::"
            done
          done

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: packages/*/native/*.node
          if-no-files-found: error

  # ── 阶段二：版本提升 + 发布到 npm ────────────────────────────────────
  release:
    name: Version & publish packages
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge native binaries into packages
        shell: bash
        run: |
          set -euo pipefail
          for d in artifacts/*/packages/*/native; do
            [ -d "$d" ] || continue
            pkg=$(basename "$(dirname "$d")")
            mkdir -p "packages/$pkg/native"
            cp -f "$d"/*.node "packages/$pkg/native/" 2>/dev/null || true
          done
          echo "Merged native binaries:"
          ls -R packages/*/native

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump versions via changesets
        run: pnpm changeset version

      - name: Build JS packages
        run: pnpm --filter "@uno-pc/jsx-directive" --filter "@uno-pc/reactivue" --filter "@uno-pc/style-layer" --filter "@uno-pc/signals-transform" run build:js

      - name: Setup npm auth
        run: npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (changesets)
        run: pnpm changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bumps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: version packages [skip ci]"
            git push
          fi

  # ── 与 release 并行：构建并部署文档站点（无先后顺序）────────────────────
  deploy-site:
    name: Build & deploy docs site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        # GitHub Pages 项目页根路径为 /uno-toolkit/，通过 DOC_BASE 注入
        env:
          DOC_BASE: /uno-toolkit/
        run: pnpm --filter website build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/doc_build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
