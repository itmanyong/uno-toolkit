  - "@rstackjs/cli-linux-x64-gnu@0.9.0"
  - "@rstackjs/cli-linux-x64-musl@0.9.0"
  - "@rstackjs/cli-win32-arm64-msvc@0.9.0"
  - "@rstackjs/cli-win32-ia32-msvc@0.9.0"
  - "@rstackjs/cli-win32-x64-msvc@0.9.0"
  - rstack@0.9.0
