packages:
  - "apps/*"
  - "examples/*"
  - "packages/*"

allowBuilds:
  "@parcel/watcher": true

catalog:
  "@types/node": "^26.6.5"
  "@types/react": "^19.3.0"
  "@types/react-dom": "19.3.0"
  "@rsbuild/core": "^2.3.0"
  "@rspress/core": "2.1.0-beta.2"
  "@rsbuild/plugin-react": "2.1.1"
  "typescript": "^7.1.0-beta"
  "rstack": "0.9.0"
  "unplugin-auto-import": "^21.1.0"
  "turbo": "2.11.10"
  "react": "19.3.1"
  "react-dom": "19.3.1"
  "@preact/signals-react": "3.12.0"
  "vite": "8.3.5"

minimumReleaseAgeExclude:
