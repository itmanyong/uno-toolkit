[package]
name = "reactivue-native"
version = "0.0.1"
edition = "2024"

[lib]
name = "reactivue_native"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"

[build-dependencies]
napi-build = "2"
